name: Daily Stock Data Pipeline

on:
  schedule:
    # 每天 UTC 16:00 执行（北京时间 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock data pipeline (daily)
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data
          python pipeline.py --stock-only --history-limit 800 --source sina

      - name: Upload collected data as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-data-${{ github.run_number }}
          path: data/
          retention-days: 30
          if-no-files-found: warn
